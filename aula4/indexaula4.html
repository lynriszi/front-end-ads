<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Recrutamento Online</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <header>
            <h1>Recrutamento Online</h1>
        </header>
            <main>
        <section>
            <h2>Cadastre seu currículo</h2>
            <form action="https://postman-echo.com/post" method="post" enctype="multipart/form-data">
                <p>Preencha o formulário para se candidatar à vaga</p>
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <div>
                        <label for="nome_id">Nome completo</label>
                        <input id="nome_id" name="nome" type="text" placeholder="Kellyn Rissi" required>
                    </div>
                    <br>
                    <div>
                        <label for="telefone_id">Telefone:</label>
                        <input id="telefone_id" name="telefone" type="tel" placeholder="(xx) xxxxx-xxxx" required>
                    </div>
                    <br>
                    <div>
                        <label for="email_id">Email:</label>
                        <input id="email_id" name="email" type="email" required>
                    </div>
                    <br>
                    <div>
                        <label for="data_nasc_id">Data de nascimento:</label>
                        <input id="data_nasc_id" name="data_nasc" type="date" required>
                    </div>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Endereço</legend>
                    <div>
                      <label for="cidade_id">Cidade:</label>
                        <input id="cidade_id" name="cidade" type="text" required>  
                    </div>
                    <br>
                    <div>
                      <label for="uf_id">UF:</label>
                        <input id="uf_id" name="uf" type="text" pattern="[A-Za-z]{2}" maxlength="2" required>  
                    </div>
                    <br>
                    <div>
                      <label for="logradouro_id">Logradouro:</label>
                        <input id="logradouro_id" name="logradouro" type="text" required>  
                    </div>
                    <br>
                    <div>
                      <label for="numero_id">Número:</label>
                        <input id="numero_id" name="numero" type="number" required>  
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Biografia</legend>
                    <div>
                        <label for="resumo_id">Fale sobre você</label>
                        <textarea id="resumo_id" 
                                  name="resumo"
                                  rows="10" 
                                  cols="50"></textarea>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Nível pretendido</legend>
                    <div>
                        <input id="estagiario_id"
                               name="nivel"
                               type="radio"
                               value="estagiario">
                        <label for="estagiario_id">Estagiário</label>
                    </div>
                    <div>
                        <input id="junior_id"
                               name="nivel"
                               type="radio" 
                               value="junior">
                       <label for="estagiario_id">Junior</label> 
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Tecnologias</legend>
                    <div>
                        <input id="tec_html_id"
                        name="tecnologia"
                        type="checkbox"
                        value="html">
                <label for="tec_html_id">HTML</label>
                    </div>
                    <div>
                        <input id="tec_css_id"
                        name="tecnologia"
                        type="checkbox"
                        value="css" >
                <label for="tec_html_id">CSS</label>
                    </div>
                    <div>
                        <input id="tec_js_id"
                        name="tecnologia"
                        type="checkbox"
                        value="js">
                <label for="tec_html_id">Java Script</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Grau de instrução</legend>
                    <div>
                        <label for="escolaridade_id">Escolaridade:</label>
                        <select id="escolaridade_id" name="escolaridade">
                            <option value="medio">Ensino Médio</option>
                            <option value="graduacao">Graduação</option>
                            <option value="pos">Pós-graduação</option>
                        </select>
                   </div>
                </fieldset>
                <div>
                    <button type="reset">Limpar dados</button>
                    <button type="submit">Enviar candidatura</button>
                </div>
            </form>
        </section>
    </main>
    <footer> 
        <p>Todos os direitos reservados</p>
    </footer>
</body>
</html>
